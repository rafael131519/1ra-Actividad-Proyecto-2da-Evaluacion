<nav class="navbar navbar-expand-lg sticky-top"
     style="background: rgba(13,13,13,0.97); border-bottom: 1px solid #222; backdrop-filter: blur(8px); z-index: 1000;">
  <div class="container">

    <a class="navbar-brand fw-bold text-white text-decoration-none"
       style="font-family: var(--font-title); font-size: 1.3rem; letter-spacing: -0.02em;"
       routerLink="/">
      Skate<span style="color: var(--color-accent);">Set</span>
    </a>

    <button class="navbar-toggler border-0 shadow-none p-1" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false">
      <i class="fa-solid fa-bars" style="color: #ccc;"></i>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-auto gap-1">
        <li class="nav-item">
          <a class="nav-link px-3 py-2" style="color: #aaa; font-size: 0.9rem; font-weight: 500;"
             routerLink="/" routerLinkActive="nav-active"
             [routerLinkActiveOptions]="{exact: true}">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3 py-2" style="color: #aaa; font-size: 0.9rem; font-weight: 500;"
             routerLink="/catalogo" routerLinkActive="nav-active">Catalogo</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3 py-2" style="color: #aaa; font-size: 0.9rem; font-weight: 500;"
             routerLink="/about" routerLinkActive="nav-active">Quienes Somos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3 py-2" style="color: #aaa; font-size: 0.9rem; font-weight: 500;"
             routerLink="/contacto" routerLinkActive="nav-active">Contacto</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
        <a routerLink="/carrito" class="position-relative text-decoration-none me-1"
           style="color: #aaa;" title="Carrito">
          <i class="fa-solid fa-bag-shopping"></i>
          @if (cart.cantidad() > 0) {
            <span class="cart-count">{{ cart.cantidad() }}</span>
          }
        </a>

        @if (auth.isLoggedIn) {
          <span style="color: var(--color-accent); font-size: 0.85rem; font-weight: 600;">
            {{ auth.currentUser()?.nombre }}
          </span>
          <button class="btn btn-ghost btn-sm py-1 px-3" (click)="logout()">Salir</button>
        } @else {
          <a routerLink="/login" class="btn btn-ghost btn-sm py-1 px-3">Entrar</a>
          <a routerLink="/register" class="btn btn-accent btn-sm py-1 px-3">Registro</a>
        }
      </div>
    </div>

  </div>
</nav>
